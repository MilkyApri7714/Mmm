name: Build APK

# Tự chạy mỗi khi bạn push lên nhánh main, hoặc bấm chạy tay ở tab Actions.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy code từ repo
        uses: actions/checkout@v4

      - name: Cài Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cài Android SDK (đã có sẵn trên máy ảo, chỉ cần cài đúng bản license + package)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      # Project chưa có gradlew (gradle-wrapper.jar bị thiếu từ đầu) — dùng action này để
      # tự tải Gradle đúng bản và cho phép gọi thẳng lệnh "gradle" bên dưới, khỏi cần ./gradlew.
      - name: Cài Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build APK debug
        run: gradle assembleDebug --no-daemon

      # APK build xong sẽ xuất hiện ở tab Actions → vào lần chạy này → mục Artifacts → tải về.
      - name: Đính kèm APK vào kết quả chạy
        uses: actions/upload-artifact@v4
        with:
          name: chibiwallpaper-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
