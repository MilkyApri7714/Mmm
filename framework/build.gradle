// Module Cubism SDK for Java Framework, copy từ CubismSdkForJava-5-r.5/Framework/framework.
// Sửa duy nhất: đường dẫn tới Core AAR (đổi vì cấu trúc thư mục project đã được phẳng hoá,
// framework/ và Core/ giờ là 2 thư mục con trực tiếp của project root thay vì lồng trong Framework/).
plugins {
    id 'com.android.library'
}

android {
    namespace = "com.live2d.sdk.cubism.framework"
    compileSdk 34

    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    // Core AAR: chỉ cần lúc BIÊN DỊCH (compileOnly). Lúc chạy, app module tự mang theo bản AAR
    // thật của nó (xem app/build.gradle.kts) — tránh đóng gói trùng 2 lần Live2DCubismCore.
    compileOnly(fileTree(dir: '../Core/android', include: ['Live2DCubismCore.aar']))

    testImplementation 'junit:junit:4.13.2'

    androidTestImplementation(fileTree(dir: '../Core/android', include: ['Live2DCubismCore.aar']))
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
}
